    The Fiddler REST API (v3) is organized around resource-oriented URLs with
    JSON request/response bodies, Bearer-token authentication, and standard HTTP
    verbs and status codes. Resource groups include Projects, Models,
    Applications, Events, Spans, Jobs, Baselines, Segments, Custom Metrics,
    Alert Rules, Environments, Explainability, Evals & Evaluators, Experiments,
    Queries, FQL Expressions, LLM Gateway, File Upload, and Users & Access Keys.
