aid: fiddler-labs
name: Fiddler Labs
description: >-
  Fiddler Labs (Fiddler AI) is an enterprise AI Observability and Security
  platform that provides unified visibility, context, and control across AI
  agents, LLM and GenAI applications, and traditional ML models. The Fiddler
  platform delivers standardized telemetry, evaluation, continuous monitoring,
  real-time guardrails, and auditable governance from development through
  production. Developers integrate through a REST API (v3), an official Python
  client (fiddler-client), framework SDKs (LangChain, LangGraph, OpenTelemetry,
  Google ADK, Strands, Evals), and a hosted Model Context Protocol (MCP) server
  that exposes GenAI observability data to AI assistants. Capabilities include
  model and application onboarding, production event ingestion, drift and
  integrity detection, custom metrics, segments, alerting, explainability, LLM
  gateway routing, and trace/span-level agentic observability.
